version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agronex-postgres
    restart: always
    environment:
      POSTGRES_DB: agronex
      POSTGRES_USER: agronex
      POSTGRES_PASSWORD: agronex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agronex -d agronex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
